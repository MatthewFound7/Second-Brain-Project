[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
description = ""
authors = []
dependencies = [
    "fastapi[standard]>=0.135.0",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
